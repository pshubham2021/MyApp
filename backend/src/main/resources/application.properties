spring.application.name=personal-website-api
server.port=${PORT:8080}

spring.datasource.url=jdbc:h2:file:${DATA_DIR:./data}/portfolio;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}
app.cookie.secure=${SESSION_COOKIE_SECURE:false}
app.upload-dir=${UPLOAD_DIR:./uploads}
